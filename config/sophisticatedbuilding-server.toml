[Validation]
	#Allow use of the mod for players that are in survival mode. Otherwise, only creative mode players can use the mod.
	allowInSurvival = true
	#Use a whitelist to determine which players can use the mod. If false, all players can use the mod.
	useWhitelist = false
	#List of player names that can use the mod.
	whitelist = ["Player1", "Player2"]
	#Maximum number of blocks that can be placed at once. This is a last check. If you want the player to receive visual feedback instead of an error message, change values in the common config.
	# Default: 10000
	# Range: 1 ~ 100000
	maxBlocksPlacedAtOnce = 10000

[Memory]
	#How many sets of blocks are remembered for the undo functionality, per player.
	# Default: 50
	# Range: 10 ~ 200
	undoStackSize = 50

[SurvivalBreaking]
	#Allow build-mode mass breaking for survival players (creative players can always use it).
	enabled = true
	#Skip a candidate tool once it has 1 use left, so the mod never breaks your tool.
	stopBeforeToolBreaks = true
	#Maximum mining delay (in ticks) for one survival break operation.
	# Default: 40
	# Range: 0 ~ 1200
	maxDelayTicks = 40
	#Hunger exhaustion applied per block broken in survival, like vanilla mining.
	# Default: 0.005
	# Range: 0.0 ~ 1.0
	exhaustionPerBlock = 0.005

[SurvivalReplace]
	#Allow survival players to use the replace modes of the radial menu (replace blocks and air / only blocks / filtered by offhand) and Quick Replace. Replaced blocks are mined like survival breaking: the right tool is used and loses durability, drops go to the inventory, protected and unbreakable blocks are skipped, and the mining delay applies.
	enabled = false

#Balanced survival breaking: build-mode mass breaking and the mining of survival replace cost survival players more
#tool durability and hunger, and each such operation starts an escalating cooldown. Operations that mine a single
#block and creative players are never affected; placing is never affected.
[BalancedBreaking]
	#Force balanced breaking for all players on this server.
	#In singleplayer (and on a LAN world you host) each player can also switch it on in the player settings (client config).
	enabled = false
	#Durability uses each mined block costs the tool (vanilla: 1). Unbreaking reduces it like vanilla.
	#With SurvivalBreaking.stopBeforeToolBreaks a tool is only used while it has more uses left than this.
	# Default: 5
	# Range: 1 ~ 20
	durabilityMultiplier = 5
	#Hunger exhaustion per mined block, used instead of SurvivalBreaking.exhaustionPerBlock (4.0 exhaustion = 1 food point).
	# Default: 0.075
	# Range: 0.0 ~ 1.0
	exhaustionPerBlock = 0.075
	#A balanced operation is refused while the player's food level (0-20, two per shank) is below this. 0 = never refused.
	# Default: 7
	# Range: 0 ~ 20
	minFoodLevel = 7
	#Cooldown after a balanced operation, in real-time seconds. Real time: it also runs while the player is offline
	#or the server is stopped, and survives relog, restart, death and respawn.
	# Default: 15
	# Range: 0 ~ 3600
	cooldownBaseSeconds = 15
	#Rolling window, in minutes, in which the balanced operations of a player are counted for the escalation.
	# Default: 30
	# Range: 1 ~ 1440
	cooldownWindowMinutes = 30
	#Operations within the window that only get the base cooldown.
	# Default: 10
	# Range: 0 ~ 1000
	cooldownFreeUses = 10
	#Seconds added to the cooldown for every operation within the window beyond the free ones.
	# Default: 5
	# Range: 0 ~ 3600
	cooldownStepSeconds = 5
	#Longest cooldown, in seconds (never shorter than the base cooldown).
	# Default: 120
	# Range: 0 ~ 86400
	cooldownMaxSeconds = 120
